name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published stable release tag (vMAJOR.MINOR.PATCH).
        required: true
        type: string
      confirmation:
        description: Type republish-reviewed-release for manual recovery.
        required: true
        type: string

concurrency:
  group: stlc-package-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Keep this exact production identity guard when back-syncing to staging.
    if: github.repository == 'surgeapi/typescript-sdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release verification code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Resolve an existing published release
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RELEASES_ENABLED: ${{ vars.STLC_PACKAGE_RELEASE_ENABLED }}
        with:
          script: |
            await require('./.github/scripts/stlc-release.cjs').resolveRelease({
              github, context, core,
              expectedRepository: 'surgeapi/typescript-sdk',
              enabled: process.env.RELEASES_ENABLED
            });
      - name: Check out the exact released commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed main ancestry and package versions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          node .github/scripts/stlc-release.cjs typescript
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.30.1'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish the released package
        run: bash ./bin/publish-npm
